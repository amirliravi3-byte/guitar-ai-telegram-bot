name: Guitar AI Processor

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque n8n job identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: guitar-ai-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # Basic Pitch is only needed for video-to-tab. We securely fetch only the
      # job type from n8n first, then install the heavier dependency conditionally.
      - name: Read job type
        id: jobmeta
        env:
          N8N_JOB_URL: ${{ secrets.N8N_JOB_URL }}
          N8N_CALLBACK_SECRET: ${{ secrets.N8N_CALLBACK_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import os
          from callback import fetch_job
          job=fetch_job(os.environ['JOB_ID'])
          jt=str(job.get('job_type',''))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"job_type={jt}\n")
          PY

      - name: Install Basic Pitch for video jobs
        if: ${{ steps.jobmeta.outputs.job_type == 'video' }}
        run: |
          pip install "basic-pitch[tf]==0.4.0"

      - name: Process
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          N8N_JOB_URL: ${{ secrets.N8N_JOB_URL }}
          N8N_CALLBACK_URL: ${{ secrets.N8N_CALLBACK_URL }}
          N8N_CALLBACK_SECRET: ${{ secrets.N8N_CALLBACK_SECRET }}
        run: |
          python app/main.py --job-id "${{ inputs.job_id }}"
